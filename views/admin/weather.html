<div class="mb-4">
    <span class="text-secondary">ADMINISTRATION</span>
    <h2>Manage forecasts</h2>
    <p class="text-secondary">Add, edit and delete forecasts.</p>
</div>

<div class="card mb-4">
    <div class="card-body">
        <h3 id="formTitle">Add forecast</h3>
        <form id="weatherForm" onsubmit="saveWeather(event)">
            <input id="weatherId" type="hidden">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="date">Date</label>
                    <input class="form-control" type="date" id="date" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="location">Location</label>
                    <input class="form-control" id="location" maxlength="100" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="weather_type">Weather type</label>
                    <select class="form-select" id="weather_type" required>
                        <option value="sunny">Sunny</option>
                        <option value="partly cloudy">Partly cloudy</option>
                        <option value="cloudy">Cloudy</option>
                        <option value="rainy">Rainy</option>
                        <option value="stormy">Stormy</option>
                        <option value="snowy">Snowy</option>
                        <option value="foggy">Foggy</option>
                        <option value="windy">Windy</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="temp_min">Minimum (°C)</label>
                    <input class="form-control" type="number" step="0.1" id="temp_min" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="temp_max">Maximum (°C)</label>
                    <input class="form-control" type="number" step="0.1" id="temp_max" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="precipitation">Precipitation (mm)</label>
                    <input class="form-control" type="number" min="0" step="0.1" id="precipitation" value="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="precipitation_probability">Chance of precipitation (%)</label>
                    <input class="form-control" type="number" min="0" max="100" id="precipitation_probability" value="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="wind_speed">Wind speed (km/h)</label>
                    <input class="form-control" type="number" min="0" step="0.1" id="wind_speed" value="0" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label" for="wind_direction">Wind direction</label>
                    <select class="form-select" id="wind_direction" required>
                        <option value="north">North</option>
                        <option value="north-east">North-east</option>
                        <option value="east">East</option>
                        <option value="south-east">South-east</option>
                        <option value="south">South</option>
                        <option value="south-west">South-west</option>
                        <option value="west">West</option>
                        <option value="north-west">North-west</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="humidity">Humidity (%)</label>
                    <input class="form-control" type="number" min="0" max="100" id="humidity" value="50" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="pressure">Pressure (hPa)</label>
                    <input class="form-control" type="number" min="0" step="0.1" id="pressure" value="1013" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label" for="uv_index">UV index</label>
                    <input class="form-control" type="number" min="0" step="0.1" id="uv_index" value="0" required>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
                <button type="button" class="btn btn-outline-secondary" onclick="resetWeatherForm()">Clear form</button>
            </div>
        </form>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <h3>Saved forecasts</h3>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Date</th>
                        <th>Location</th>
                        <th>Temperature</th>
                        <th>Weather</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="weatherRows"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="6" class="text-center">Summary: <strong id="weatherCount">0</strong> forecast(s)</td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>
</div>
