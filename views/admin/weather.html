<div class="mb-4"><span class="eyebrow text-secondary">ADMINISZTRÁCIÓ</span>
    <h2>Előrejelzések kezelése</h2>
    <p class="text-secondary">Új előrejelzés rögzítése, módosítása és törlése.</p>
</div>
<div class="form-panel mb-4">
    <h3>Előrejelzés adatai</h3>
    <form id="weatherForm" onsubmit="saveWeather()"><input id="weatherId" type="hidden">
        <div class="row g-3">
            <div class="col-md-4"><label class="form-label">Dátum</label><input class="form-control" type="date"
                    id="date" required></div>
            <div class="col-md-4"><label class="form-label">Helyszín</label><input class="form-control" id="location"
                    required></div>
            <div class="col-md-4"><label class="form-label">Időjárástípus</label><select class="form-select"
                    id="weather_type" required>
                    <option>Napos</option>
                    <option>Változóan felhős</option>
                    <option>Felhős</option>
                    <option>Esős</option>
                    <option>Zivataros</option>
                    <option>Havas</option>
                    <option>Ködös</option>
                </select></div>
            <div class="col-md-3"><label class="form-label">Minimum °C</label><input class="form-control" type="number"
                    id="temp_min" required></div>
            <div class="col-md-3"><label class="form-label">Maximum °C</label><input class="form-control" type="number"
                    id="temp_max" required></div>
            <div class="col-md-3"><label class="form-label">Csapadék (mm)</label><input class="form-control"
                    type="number" min="0" step=".1" id="precipitation" value="0"></div>
            <div class="col-md-3"><label class="form-label">Csapadék esélye (%)</label><input class="form-control"
                    type="number" min="0" max="100" id="precipitation_probability" value="0"></div>
            <div class="col-md-3"><label class="form-label">Szélsebesség (km/h)</label><input class="form-control"
                    type="number" min="0" id="wind_speed" value="0"></div>
            <div class="col-md-3"><label class="form-label">Szélirány</label><input class="form-control"
                    id="wind_direction" value="N"></div>
            <div class="col-md-2"><label class="form-label">Páratartalom (%)</label><input class="form-control"
                    type="number" min="0" max="100" id="humidity" value="50"></div>
            <div class="col-md-2"><label class="form-label">Légnyomás (hPa)</label><input class="form-control"
                    type="number" id="pressure" value="1013"></div>
            <div class="col-md-2"><label class="form-label">UV-index</label><input class="form-control" type="number"
                    min="0" id="uv_index" value="0"></div>
        </div>
        <div class="mt-3"><button class="btn btn-primary">Mentés</button> <button type="reset"
                class="btn btn-outline-secondary" onclick="document.querySelector('#weatherId').value=''">Űrlap
                ürítése</button></div>
    </form>
</div>
<div class="panel">
    <h3>Rögzített előrejelzések</h3>
    <div class="table-responsive">
        <table class="table table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Dátum</th>
                    <th>Helyszín</th>
                    <th>Hőmérséklet</th>
                    <th>Műveletek</th>
                </tr>
            </thead>
            <tbody id="weatherRows"></tbody>
            <tfoot>
                <td colspan="7" class="text-center">Summary: <strong id="weatherCount">0</strong></td>
            </tfoot>
        </table>
    </div>
</div>
