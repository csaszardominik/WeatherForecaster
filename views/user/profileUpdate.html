<div class="row g-4">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <h2>My profile</h2>
                <p class="text-secondary">You can change your name and e-mail address here.</p>
                <div class="mb-3">
                    <label class="form-label" for="name">Name</label>
                    <input class="form-control" id="name">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail address</label>
                    <input class="form-control" id="email" type="email">
                </div>
                <button type="button" class="btn btn-primary" onclick="updateProfile()">Save profile</button>
            </div>
        </div>
    </div>
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body">
                <h2>Change password</h2>
                <div class="mb-3">
                    <label class="form-label" for="oldpass">Old password</label>
                    <input class="form-control" id="oldpass" type="password">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="newpass">New password</label>
                    <input class="form-control" id="newpass" type="password">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm">Confirm new password</label>
                    <input class="form-control" id="confirm" type="password">
                </div>
                <button type="button" class="btn btn-primary" onclick="updatePasswd()">Change password</button>
            </div>
        </div>
    </div>
</div>
