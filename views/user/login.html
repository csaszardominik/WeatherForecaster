<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <div class="form-panel">
            <div class="text-center mb-4">
                <div><i class="bi bi-cloud-fill"></i></div>
                <h2>Bejelentkezés</h2>
                <p class="text-secondary">Lépj be az időjárás részletes adataiért.</p>
            </div>
            <form onclick="login()">
                <div class="mb-3"><label class="form-label" for="email">E-mail-cím</label><input class="form-control"
                        id="email" type="email" required></div>
                <div class="mb-3"><label class="form-label" for="passwd">Jelszó</label><input class="form-control"
                        id="passwd" type="password" required></div><button
                    class="btn btn-primary w-100">Bejelentkezés</button>
            </form>
            <p class="mt-3 mb-0 text-center">Nincs fiókod? <a href="#"
                    onclick="navigate('views/user/register')">Regisztrálj!</a></p>
        </div>
    </div>
</div>
